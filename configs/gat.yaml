# Stage 3-4: graph + GAT
graph:
  k_nn: 8
  edge_min_sim: 0.3
  mode: knn_emb               # knn_emb | no_graph | random_graph
  random_seed: 1234
model:
  hidden: 128
  heads: 4
  dropout: 0.1
train:
  tau: 0.05
  lr: 1.0e-4
  weight_decay: 0.01
  batch_queries: 32
  max_epochs: 20
  patience: 3
  seed: 0
  eval_batch_queries: 256
sanity:
  max_drop_vs_bi: 0.005       # GAT-only val NDCG@10 may not be below s_bi by more than this
controls:                     # Sec. 6.6, all evaluated on val
  - {name: no_graph,     mode: no_graph,     k_nn: 8,  edge_min_sim: 0.3}
  - {name: random_graph, mode: random_graph, k_nn: 8,  edge_min_sim: 0.3}
  - {name: knn_k4_s0.0,  mode: knn_emb, k_nn: 4,  edge_min_sim: 0.0}
  - {name: knn_k4_s0.3,  mode: knn_emb, k_nn: 4,  edge_min_sim: 0.3}
  - {name: knn_k4_s0.5,  mode: knn_emb, k_nn: 4,  edge_min_sim: 0.5}
  - {name: knn_k8_s0.0,  mode: knn_emb, k_nn: 8,  edge_min_sim: 0.0}
  - {name: knn_k8_s0.3,  mode: knn_emb, k_nn: 8,  edge_min_sim: 0.3}
  - {name: knn_k8_s0.5,  mode: knn_emb, k_nn: 8,  edge_min_sim: 0.5}
  - {name: knn_k16_s0.0, mode: knn_emb, k_nn: 16, edge_min_sim: 0.0}
  - {name: knn_k16_s0.3, mode: knn_emb, k_nn: 16, edge_min_sim: 0.3}
  - {name: knn_k16_s0.5, mode: knn_emb, k_nn: 16, edge_min_sim: 0.5}
